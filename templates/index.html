<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Caça aos Achadinhos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#08090d;--card:#12141b;--card2:#191c25;--line:#292d38;--orange:#ff7a00;--yellow:#ffc247;--green:#36d98a;--text:#f8f8fa;--muted:#8f95a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% -10%,#ff7a0028,transparent 35%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}.app{max-width:460px;margin:auto;padding:14px 12px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.fox{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#ff9a3d,#ff6200);display:grid;place-items:center;font-size:27px;box-shadow:0 10px 35px #ff6b0030}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.stats{display:flex;gap:6px}.pill{background:var(--card);border:1px solid var(--line);padding:8px 9px;border-radius:11px;font-size:11px}.pill span{color:var(--yellow);font-weight:800}.hero{background:linear-gradient(145deg,#171a22,#101218);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.streak{margin-top:13px;padding:10px 12px;background:#ff7a0012;border:1px solid #ff7a0030;border-radius:13px;font-size:11px}.streak b{color:#ff9b4a}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.mode{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px;text-align:left;color:var(--text);cursor:pointer}.mode.active{border-color:#ff7a0070;background:#ff7a0014}.mode strong{display:block;font-size:13px}.mode small{display:block;color:var(--muted);margin-top:4px;font-size:9px}.game{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:15px;min-height:330px}.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.tag{font-size:9px;color:#ff9b4a;background:#ff7a0015;padding:6px 8px;border-radius:8px;font-weight:800}.question{font-size:17px;font-weight:800;margin-bottom:13px}.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.box{min-height:155px;border:1px solid #303541;background:linear-gradient(145deg,#1c2029,#12151c);border-radius:17px;color:white;cursor:pointer;padding:10px;transition:.15s}.box:active{transform:scale(.97)}.box .emoji{font-size:42px;margin:16px 0 10px}.box b{font-size:10px;display:block;line-height:1.25}.product{border:1px solid #303541;background:#171a22;border-radius:18px;padding:13px}.productvisual{height:120px;border-radius:14px;background:linear-gradient(145deg,#252a35,#151821);display:grid;place-items:center;font-size:60px;margin-bottom:12px}.product h3{margin:0;font-size:15px}.meta{display:flex;gap:6px;margin:7px 0}.badge{font-size:8px;padding:5px 7px;border-radius:7px;background:#ffffff09;color:var(--muted)}.price{font-size:23px;font-weight:900;color:#61e69b}.old{text-decoration:line-through;color:#707683;font-size:10px;margin-left:5px}.options{display:grid;gap:8px;margin-top:12px}.option{border:1px solid var(--line);background:#1a1d26;border-radius:12px;padding:13px;color:white;font-weight:800;cursor:pointer}.duel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0d12ed;border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:9px 12px;z-index:5}.nav{max-width:460px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button{background:transparent;border:0;color:#747b89;padding:8px;font-size:9px;cursor:pointer}.nav button.active{color:#ff984d}.panel{display:none}.panel.active{display:block}.ranking{display:grid;gap:7px}.rank{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:11px;border-radius:13px}.rankpos{width:25px;text-align:center;color:#ffb04f;font-weight:900}.rankname{flex:1;font-size:12px}.rankpoints{font-size:11px;color:var(--yellow);font-weight:800}.result{margin-top:12px;border-radius:15px;padding:12px;font-size:11px;line-height:1.5}.good{background:#36d98a12;border:1px solid #36d98a30;color:#8af0bb}.bad{background:#ff535312;border:1px solid #ff535330;color:#ff9999}.offer{margin-top:10px;width:100%;border:0;background:linear-gradient(135deg,#ff963f,#ff6100);color:white;padding:13px;border-radius:12px;font-weight:900;cursor:pointer}.hint{text-align:center;color:var(--muted);font-size:10px;padding:14px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="fox">🦊</div><div><b>Caça aos Achadinhos</b><small>Shopee + Mercado Livre</small></div></div><div class="stats"><div class="pill">⭐ <span id="points">0</span></div><div class="pill">🪙 <span id="coins">0</span></div></div></header>

<section class="hero">
<h1>Encontre o achadinho 🔥</h1>
<p>Jogue, acumule pontos e descubra ofertas que valem a pena.</p>
<div class="streak">🔥 Sequência: <b id="streak">0 dias</b> · Melhor: <b id="best">0</b></div>
</section>

<div class="modes">
<button class="mode active" data-mode="hunt"><strong>🎁 Caça ao Achadinho</strong><small>Encontre a caixa premiada</small></button>
<button class="mode" data-mode="price"><strong>💰 Adivinhe o Preço</strong><small>Qual é o preço real?</small></button>
<button class="mode" data-mode="duel"><strong>⚔️ Duelo</strong><small>Escolha seu favorito</small></button>
<button class="mode" data-mode="ranking"><strong>🏆 Ranking</strong><small>Veja os caçadores</small></button><button class="mode" data-mode="shop"><strong>🛒 Loja</strong><small>Gaste suas moedas</small></button>
</div>

<section id="gamePanel" class="game panel active"></section>
<section id="shopPanel" class="panel"><div class="game"><div class="gamehead"><b>🛒 Loja</b><span class="tag">MOEDAS</span></div><div id="shopItems" class="ranking"></div></div></section>
<section id="rankingPanel" class="panel"><div class="game"><div class="gamehead"><b>🏆 Ranking</b><span class="tag">TOP 20</span></div><div id="ranking" class="ranking"></div></div></section>
</div>

<nav class="bottom"><div class="nav"><button class="active" data-nav="game">🎮<br>Jogar</button><button data-nav="ranking">🏆<br>Ranking</button><button data-nav="profile">👤<br>Perfil</button></div></nav>

<script>
const tg=window.Telegram?.WebApp||null;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#08090d');tg.setBackgroundColor('#08090d')}catch(e){}}
const api='';
const telegramUser=tg?.initDataUnsafe?.user;
const playerId=telegramUser?.id?String(telegramUser.id):'demo';
const playerName=telegramUser?.first_name||'Caçador';
let currentMode='hunt';

const $=id=>document.getElementById(id);
const money=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

async function get(url){const r=await fetch(api+url);if(!r.ok)throw Error('Falha ao carregar');return r.json()}
async function post(url,data){const r=await fetch(api+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.erro||'Erro');return j}

function updatePlayer(p){if(!p)return;$('points').textContent=p.pontos||0;$('coins').textContent=p.moedas||0;$('streak').textContent=(p.sequencia||0)+' acertos';$('best').textContent=p.melhor_sequencia||0;if(p.bonus_diario?.recebeu)alert('🎁 Bônus diário! +'+p.bonus_diario.moedas+' moedas e +'+p.bonus_diario.pontos+' pontos.');}

async function loadPlayer(){try{updatePlayer(await get('/api/player?user_id='+encodeURIComponent(playerId)+'&name='+encodeURIComponent(playerName)))}catch(e){}}

function resultBox(ok,text){return '<div class="result '+(ok?'good':'bad')+'">'+text+'</div>'}

async function hunt(){
 currentMode='hunt';
 const d=await get('/api/game/hunt?user_id='+encodeURIComponent(playerId)+'&name='+encodeURIComponent(playerName));
 $('gamePanel').innerHTML='<div class="gamehead"><b>🎁 Caça ao Achadinho</b><span class="tag">+100 ⭐</span></div><div class="question">Uma caixa esconde o achadinho do dia. Qual você abre?</div><div class="boxes">'+d.caixas.map(c=>'<button class="box" onclick="answerHunt('+c.posicao+',\''+c.produto.id+'\',this)"><div class="emoji">📦</div><b>CAIXA '+(c.posicao+1)+'</b></button>').join('')+'</div><div class="hint">Escolha uma caixa. Você só tem uma tentativa.</div>';
 window.huntRound=d;
}
async function answerHunt(pos,id,el){
 document.querySelectorAll('.box').forEach(x=>x.disabled=true);
 try{const d=await post('/api/game/hunt/answer',{user_id:playerId,name:playerName,rodada_id:window.huntRound.rodada_id,posicao:pos,produto_id:id});updatePlayer(d.player);$('gamePanel').insertAdjacentHTML('beforeend',resultBox(d.acertou,'<b>'+(d.acertou?'🎉 ACERTOU!':'😅 QUASE!')+'</b><br>'+(d.acertou?'Você encontrou o achadinho e ganhou 100 pontos.':'O achadinho era <b>'+escapeHtml(d.achadinho.nome)+'</b>.')+'<button class="offer" onclick="showOffer(\''+d.achadinho.id+'\')">🛒 VER OFERTA</button>'))}catch(e){alert(e.message)}
}
async function price(){
 currentMode='price';
 const d=await get('/api/game/price?user_id='+playerId+'&name='+encodeURIComponent(playerName));
 const p=d.produto;
 $('gamePanel').innerHTML='<div class="gamehead"><b>💰 Adivinhe o Preço</b><span class="tag">+150 ⭐</span></div><div class="product"><div class="productvisual">'+p.imagem+'</div><h3>'+escapeHtml(p.nome)+'</h3><div class="meta"><span class="badge">'+(p.plataforma==='shopee'?'🟠 Shopee':'🟡 Mercado Livre')+'</span><span class="badge">'+escapeHtml(p.categoria)+'</span></div></div><div class="question" style="margin-top:13px">Quanto você acha que custa?</div><div class="options">'+d.opcoes.map(v=>'<button class="option" onclick="answerPrice('+v+')">'+money(v)+'</button>').join('')+'</div>';
 window.priceRound=d;
}
async function answerPrice(v){
 document.querySelectorAll('.option').forEach(x=>x.disabled=true);
 try{const d=await post('/api/game/price/answer',{user_id:playerId,name:playerName,rodada_id:window.priceRound.rodada_id,preco:v});updatePlayer(d.player);$('gamePanel').insertAdjacentHTML('beforeend',resultBox(d.acertou,'<b>'+(d.acertou?'🎯 PREÇO EXATO!':'😅 PASSOU PERTO!')+'</b><br>O preço real era <b>'+money(d.preco_real)+'</b>.<button class="offer" onclick="showOffer(\''+d.produto.id+'\')">🛒 VER OFERTA</button>'))}catch(e){alert(e.message)}
}
async function duel(){
 currentMode='duel';
 const d=await get('/api/game/duel?user_id='+playerId+'&name='+encodeURIComponent(playerName));
 $('gamePanel').innerHTML='<div class="gamehead"><b>⚔️ Duelo dos Achadinhos</b><span class="tag">+50 ⭐</span></div><div class="question">Qual desses você compraria?</div><div class="duel">'+d.produtos.map(p=>'<button class="box" onclick="answerDuel(\''+p.id+'\')"><div class="emoji">'+p.imagem+'</div><b>'+escapeHtml(p.nome)+'</b><div style="margin-top:8px;color:#62e69a">'+money(p.preco)+'</div></button>').join('')+'</div>';
 window.duelRound=d;
}
async function answerDuel(id){
 try{const d=await post('/api/game/duel/answer',{user_id:playerId,name:playerName,rodada_id:window.duelRound.rodada_id,produto_id:id});updatePlayer(d.player);$('gamePanel').insertAdjacentHTML('beforeend',resultBox(true,'❤️ Boa escolha! Você ganhou <b>50 pontos</b>.<button class="offer" onclick="showOffer(\''+id+'\')">🛒 VER OFERTA</button>'))}catch(e){alert(e.message)}
}
async function showOffer(id){
 try{const d=await post('/api/offer/view',{user_id:playerId,name:playerName,produto_id:id});updatePlayer(d.player);if(d.url&&d.url!=='#')window.open(d.url,'_blank');else alert('A oferta será conectada ao produto real na próxima integração.')}catch(e){}
}
async function shop(){try{const items=await get('/api/shop');$('shopItems').innerHTML=items.map(i=>'<div class="rank"><div class="rankname"><b>'+i.nome+'</b><br><span style="color:#8f95a3;font-size:10px">'+i.descricao+'</span></div><div class="rankpoints">🪙 '+i.preco_moedas+'</div></div>').join('')}catch(e){$('shopItems').innerHTML='<div class="hint">Loja indisponível.</div>'}}
async function ranking(){
 $('ranking').innerHTML='<div class="hint">Carregando...</div>';
 try{const list=await get('/api/ranking');$('ranking').innerHTML=list.length?list.map(r=>'<div class="rank"><div class="rankpos">#'+r.posicao+'</div><div class="rankname">'+escapeHtml(r.nome)+'</div><div class="rankpoints">⭐ '+r.pontos+'</div></div>').join(''):'<div class="hint">Você será o primeiro do ranking. Jogue agora!</div>'}catch(e){$('ranking').innerHTML='<div class="hint">Não foi possível carregar o ranking.</div>'}
}
function setMode(mode){
 currentMode=mode;
 document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 if(mode==='hunt'){ $('rankingPanel').classList.remove('active');$('gamePanel').classList.add('active');hunt() }
 if(mode==='price'){ $('rankingPanel').classList.remove('active');$('gamePanel').classList.add('active');price() }
 if(mode==='duel'){ $('rankingPanel').classList.remove('active');$('gamePanel').classList.add('active');duel() }
 if(mode==='ranking'){ $('gamePanel').classList.remove('active');$('shopPanel').classList.remove('active');$('rankingPanel').classList.add('active');ranking() }
 if(mode==='shop'){ $('gamePanel').classList.remove('active');$('rankingPanel').classList.remove('active');$('shopPanel').classList.add('active');shop() }
}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 if(b.dataset.nav==='ranking')setMode('ranking');
 else if(b.dataset.nav==='profile'){alert('Perfil: '+playerName+'\nPontos: '+$('points').textContent+'\nMoedas: '+$('coins').textContent)}
 else setMode(currentMode==='ranking'?'hunt':currentMode);
}));
loadPlayer();hunt();
</script>
</body>
</html>
